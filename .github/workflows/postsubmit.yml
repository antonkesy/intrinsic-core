name: Post-submit Bazel Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-8core
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Build Intrinsic Core Artifacts
        uses: ./.github/actions/build-intrinsic-core-artifacts
        with:
          working-directory: .
          upload-artifacts: "false"
