syntax = "proto3";

package intrinsic.proto;

import "google/protobuf/any.proto";

option go_package = "intrinsic/motion_planning/path_planning/validators_config_go_proto";

// Mapping from the EdgeValidatorSpecification to the specific edge validator is
// performed via CreateEdgeValidator(const KinematicsSystemProxy& proxy, const
// proto::EdgeValidatorSpecification& spec) in
// intrinsic/path_planning/validators.cc.
message EdgeValidatorSpecification {
  string name = 1;
  google.protobuf.Any config = 2;
}

// Mapping from the PointValidatorSpecification to the specific edge validator
// is performed via CreatePointValidator(const KinematicsSystemProxy& proxy,
// const proto::PointValidatorSpecification& spec) in
// intrinsic/path_planning/validators.cc.
message PointValidatorSpecification {
  string name = 1;
}

message EdgeValidatorConfig {
  // The resolution of the collision checks up to which the edge validator will
  // check the validity of the edge.
  double resolution = 1;
}

message SoftMarginEdgeValidatorConfig {
  EdgeValidatorConfig base_config = 1;
  double threshold = 2;
}
