syntax = "proto3";

package intrinsic.proto;

import "intrinsic/motion_planning/path_planning/validators_config.proto";

option go_package = "intrinsic/motion_planning/path_planning/planners/shortcutter_configs_go_proto";

// Used to configure JointShortcutter.
message JointShortcutterConfig {
  bool use_binary_search = 1;
  bool combine_collinear_segments = 4;
  EdgeValidatorSpecification edge_validator_spec = 2;
  PointValidatorSpecification point_validator_spec = 3;
}

// Used to configure ToolActuationShortcutter.
message ToolActuationShortcutterConfig {
  int64 degree_of_freedom = 1;
  EdgeValidatorSpecification edge_validator_spec = 2;
  PointValidatorSpecification point_validator_spec = 3;
}

// Used to configure SweptVolumeShortcutter.
message SweptVolumeShortcutterConfig {
  EdgeValidatorSpecification edge_validator_spec = 2;
  PointValidatorSpecification point_validator_spec = 3;
  // Directory which holds the tensorflow SavedModel for approximating swept
  // volume.
  string model_directory = 4;
  // Set original |swept volume| of robot in a fixed configuration.
  double robot_volume = 5;
}
