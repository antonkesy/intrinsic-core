syntax = "proto3";

package intrinsic.proto;

import "google/protobuf/any.proto";

option go_package = "intrinsic/motion_planning/path_planning/planners/pipeline_configs_go_proto";

// Used to configuere PipelinePathPlanner.
//
// Represented by a list of Anys allowing us to instantiate a list of
// arbitrary PathPlanners.
message PipelinePathPlannerConfig {
  // Generic spec for instantiating a PathPlanner.
  message Spec {
    string name = 1;
    google.protobuf.Any config = 2;
  }

  repeated Spec specs = 1;

  // If true, the pipeline planner expands all the results returned by each
  // child planner. As there is no parallelism, this could be VERY SLOW
  // depending on whether there are many child planners that returns multiple
  // results.
  //
  // If false only the first results from each planner is expanded, resulting in
  // a single result from the pipeline.
  bool expand_all_paths = 2;
}
