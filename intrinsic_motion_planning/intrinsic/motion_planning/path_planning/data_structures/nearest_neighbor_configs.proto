syntax = "proto3";

package intrinsic.proto;

import "google/protobuf/any.proto";

option go_package = "intrinsic/motion_planning/path_planning/data_structures/nearest_neighbor_configs_go_proto";

// Mapping from the NearestNeighborSpecification to the nearest neighbor
// data structure is done via CreateNearestNeighbor(const
// proto::NearestNeighborSpecification& config) in
// intrinsic/path_planning/data_structures/nearest_neighbor_utils.h.
message NearestNeighborSpecification {
  string name = 1;
  google.protobuf.Any config = 2;
}

message NearestNeighborConfig {
  // The nearest neighbor strategy that will be applied.
  enum NearestNeighborStrategy {
    UNDEFINED = 0;
    NEAREST = 1;
    KNEAREST = 2;
    RADIUS = 3;
    HNS = 4;
  }

  // Configures the default number of maximum neighbors returned with an
  // k-nearest neighbor strategy.
  int32 k = 1;

  // The radius in which other elements in the data structure are considered
  // as nearest neighbors if a radius strategy for nearest neighbor search is
  // applied.
  double radius = 2;

  NearestNeighborStrategy strategy = 3;
}
