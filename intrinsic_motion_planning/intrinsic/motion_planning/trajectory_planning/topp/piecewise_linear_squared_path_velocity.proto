syntax = "proto3";

package intrinsic_proto.topp;

option go_package = "intrinsic/motion_planning/trajectory_planning/topp/piecewise_linear_squared_path_velocity_go_proto";

// Phase space state (b, bp) at a discrete collocation point.
message PhaseStateProto {
  // Squared path velocity `b = (ds/dt)^2`.
  double b = 1;

  // First derivative of squared path velocity `bp = db/ds`.
  double bp = 2;
}

// A piecewise linear representation of a squared path velocity profile.
message PiecewiseLinearSquaredPathVelocityProto {
  repeated double path_variables = 1;
  repeated double cumulative_times = 2;
  repeated PhaseStateProto phase_states = 3;
}
