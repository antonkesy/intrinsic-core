syntax = "proto3";

package intrinsic_proto.topp;

import "intrinsic/math/proto/bspline.proto";

option go_package = "intrinsic/motion_planning/trajectory_planning/topp/bspline_squared_path_velocity_go_proto";

// A B-spline based representation of a squared path velocity.
message BSplineSquaredPathVelocity {
  // The B-spline of degree 1 representing the squared path velocity.
  BSpline spline = 1;

  reserved "enable_adaptive_sampling_and_topp_integrals";
  reserved 2;
}
