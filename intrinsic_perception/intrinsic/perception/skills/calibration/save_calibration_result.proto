syntax = "proto3";

package intrinsic_proto.skills;

import "intrinsic/perception/proto/v1/calibration_service.proto";
import "intrinsic/assets/proto/v1/resolved_dependency.proto";
import "intrinsic/assets/proto/field_metadata.proto";

option go_package = "intrinsic/perception/skills/calibration/save_calibration_result_go_proto";
option java_multiple_files = true;
option java_outer_classname = "SaveCalibrationResult";

message SaveCalibrationResultParams {
  // A calibration result, typically from an intrinsic, camera-to-robot and/or
  // camera-to-camera calibration session, which should be saved. This may
  // includes both intrinsic and extrinsic (updated camera pose) parameters.
  intrinsic_proto.perception.v1.CalibrationResult calibration_result = 1;

  // The calibration service.
  intrinsic_proto.assets.v1.ResolvedDependency calibration_service = 2
      [(intrinsic_proto.assets.field_metadata).dependency = {
        requires: "grpc://intrinsic_proto.perception.v1.CalibrationService"
      }];
}
