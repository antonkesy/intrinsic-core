syntax = "proto3";

package intrinsic_proto.skills;

import "intrinsic/assets/proto/field_metadata.proto";
import "intrinsic/assets/proto/v1/resolved_dependency.proto";
import "intrinsic/motion_planning/skills/move_robot.proto";
import "intrinsic/skills/apps/attach_object_to_robot.proto";
import "intrinsic/skills/apps/detach_object.proto";
import "intrinsic/skills/apps/update_world.proto";

message PreplanMotionParams {
  // The `MotionPlannerService` (MPS) Asset specification.
  intrinsic_proto.assets.v1.ResolvedDependency
      motion_planner_service = 2 [(intrinsic_proto.assets.field_metadata)
                                      .dependency = {
    requires: "grpc://intrinsic_proto.motion_planning.v1.MotionPlannerService",
    skill_annotations: { always_provide_connection_info: true }
  }];

  // The skill calls to "simulate". The order here is important.
  repeated PreplanMotionSkillCall skills = 1;
}

message PreplanMotionSkillCall {
  // A set of supported skill calls. Their values should be the same as the
  // ones in actual execution.
  oneof skill_call {
    intrinsic_proto.skills.MoveRobotParams move_robot = 1;
    intrinsic_proto.skills.AttachObjectToRobotParams attach_object_to_robot = 2;
    intrinsic_proto.skills.DetachObjectParams detach_object = 3;
    intrinsic_proto.skills.UpdateWorldParams update_world = 4;
  }
}
