syntax = "proto3";

package intrinsic_proto.conductor;

import "google/protobuf/timestamp.proto";

option go_package = "intrinsic/conductor/proto/save_status_go_proto";

enum SaveStatus {
  SAVE_STATUS_UNKNOWN = 0;
  SAVE_STATUS_MODIFIED = 1;
  SAVE_STATUS_SAVED = 2;
}

message SaveState {
  // The current save status of the world against the resource set.
  SaveStatus status = 1;

  // The best guess of the last time that the solution was saved. May be up to
  // one second of error.
  google.protobuf.Timestamp last_save_time = 2;

  // The world ID that was used to compare against the resource set generated
  // world.
  string world_id = 3;
}
