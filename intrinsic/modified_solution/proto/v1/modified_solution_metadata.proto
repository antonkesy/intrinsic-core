syntax = "proto3";

package intrinsic_proto.modified_solution.v1;

import "google/protobuf/timestamp.proto";

option go_package = "intrinsic/modified_solution/proto/v1/modified_solution_metadata_go_proto";

// Metadata about a modified solution.
message ModifiedSolutionMetadata {
  // Unique identifier for the modified solution. The identifier is always
  // automatically generated (UUID).
  string name = 1;

  // Information about where the modified solution is valid and can be applied.
  // The included information may be used to determine if the modified solution
  // can be applied to a specific solution in the catalog and/or a running
  // solution.
  message ValidFor {
    // Reference to a solution in the catalog (instance). This is a URI for a
    // single document. The modified solution is only valid for this instance.
    string catalog_uri = 2;

    reserved 1, 3;
    reserved "owner", "solution_id_version";
  }

  // Described under what circumstances the modified solution can be restored.
  ValidFor valid_for = 2;

  // Auto-populated timestamp when the modified solution was created.
  google.protobuf.Timestamp created_time = 3;

  // Object ID of the corresponding ModifiedSolution stored in
  // content-addressable storage. Typically starts with intcas://.
  string cas_object_id = 4;
}
