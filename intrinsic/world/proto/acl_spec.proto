syntax = "proto3";

package intrinsic_proto.world;

option go_package = "intrinsic/world/proto/acl_spec_go_proto";

// Access spec for an entity.
message WorldEntityACLSpec {
  bool can_read_entity_data = 1;
  bool can_write_entity_data = 2;
}

// Access spec for a world.
message WorldACLSpec {
  // The default acl used when requesting acls for an unspecified entity.
  WorldEntityACLSpec default_acl = 1;

  // The set of specified acls for entities.
  map<uint32, WorldEntityACLSpec> entities = 2;
}
