syntax = "proto3";

package intrinsic_proto.world;

option go_package = "intrinsic/world/proto/ppr_component_go_proto";

// Component for associating entities with a PPR resource instance or product.
message PPRComponent {
  oneof type {
    // Matches the resource instance name if the PPR component refers to a
    // resource instance.
    string resource_name = 1;
  }

  reserved 2, 3, 4, 5;
  reserved "product", "from_resource_instance", "from_resource_set_updates",
      "product_part_name";
}
