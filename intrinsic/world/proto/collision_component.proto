syntax = "proto3";

package intrinsic_proto.world;

option go_package = "intrinsic/world/proto/collision_component_go_proto";

// Component indicating the owning Entity has collision-related data.
message CollisionComponent {
  // Rule for excluding collisions between this Entity and one or more other
  // Entities.
  //
  // Rules do not need to be bidirectional. When evaluating if two Entities
  // collide, if either Entity has an applicable exclusion, the Entities will
  // not collide.
  message Exclusion {
    oneof type_oneof {
      // UID of another Entity with collision. Transitive relationships are not
      // followed. For example, to exclude collision with a robot, the UIDs of
      // the links (and other collidable Entities) must be listed separately
      // rather than the UID of the robot Entity itself.
      uint32 uid = 1;
    }
  }
  repeated Exclusion exclusions = 1;

  // False if this Entity should generate a physical collision response when it
  // collides with other entities in simulation.
  bool has_no_collision_response = 2;
}
