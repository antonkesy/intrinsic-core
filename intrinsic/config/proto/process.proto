syntax = "proto3";

package intrinsic_proto.config;

import "intrinsic/executive/proto/behavior_tree.proto";

option go_package = "intrinsic/config/proto/process_go_proto";

// Describes the content of a process template/type, e.g. skills and notebooks.
message Process {
  // TODO(nickcox): Define corresponding protos for skill bundles and refer to
  // them from here.

  // A runnable is something that the workcell/executive can run.
  message Runnable {
    oneof runnable {
      intrinsic_proto.executive.BehaviorTree behavior_tree = 3;
    }
    reserved "notebook", "partial_order_plan", "sequential_plan";
    reserved 1, 2, 4;
  }

  // References a key from the list of runnables which should be loaded on
  // startup. If autostart is true, it gets started once the application is
  // running.
  message DefaultRunnable {
    string runnable_key = 1;

    // If set to true, the executive will create an operation and load the
    // process on startup (but not start it, works only for behavior trees).
    bool autoload = 3;

    // If set to true, the executive will start the operation created when
    // loading the behavior tree. This flag is only observed when autoload is
    // also true.
    bool autostart = 2;
  }

  DefaultRunnable default_runnable = 5;

  // Named references to runnables (notebook, behavior tree, etc).
  // LINT.IfChange
  map<string, Runnable> runnables = 2;
  // LINT.ThenChange(//intrinsic/config/proto/process_internal.proto)

  // Workaround for the time being: Since we cannot serialize/deserialize `Any`
  // protos to JSON, we will store them as bytes instead. A valid `Process`
  // may not have `runnables` and `runnables_as_bytes` that are both non-empty.
  // Notice we cannot use `oneof` here because `oneof` does not support `map`
  // variants:
  // https://developers.google.com/protocol-buffers/docs/proto3#using_oneof
  bytes runnables_as_bytes = 4;

  reserved 1, 3;
  reserved "data_files", "metadata";
}
