syntax = "proto3";

package intrinsic_proto.config;

import "google/protobuf/timestamp.proto";
import "intrinsic/assets/data/proto/v1/data_asset.proto";
import "intrinsic/assets/hardware_devices/proto/v1/hardware_device_manifest.proto";
import "intrinsic/assets/processes/proto/process_asset.proto";
import "intrinsic/assets/proto/id.proto";
import "intrinsic/assets/proto/v1/instance_config.proto";
import "intrinsic/assets/scene_objects/proto/scene_object_manifest.proto";
import "intrinsic/assets/services/proto/service_manifest.proto";
import "intrinsic/config/proto/common.proto";
import "intrinsic/config/proto/operation_mode.proto";
import "intrinsic/config/proto/process.proto";
import "intrinsic/config/proto/resource_set.proto";
import "intrinsic/skills/proto/processed_skill_manifest.proto";
import "intrinsic/world/proto/object_world_updates.proto";

option go_package = "intrinsic/config/proto/application_go_proto";

// Describes an application template/type/instance.
// Next ID: 18
message Application {
  reserved 6;
  reserved "pose_estimation_configs";

  Metadata metadata = 1;

  // Process data of this application.
  Process process = 2;

  // Resources required for this application.
  ResourceSet resources = 8;

  message Skills {
    // Skill id_version
    repeated string skill_id_versions = 1;
  }

  Skills skills = 10;

  // Indicates whether or not the proto can be used.
  // It has been added in the context of transitioning to versioned solutions.
  //
  // This field is unset by default.
  // If it is set the application must not be used.
  optional google.protobuf.Timestamp migrate_time = 16;

  // The versioned solution ID of this application.
  optional string versioned_solution_id = 17;

  message Asset {
    oneof variant {
      intrinsic_proto.assets.IdVersion catalog = 1;
      intrinsic_proto.services.ProcessedServiceManifest service = 2;
      intrinsic_proto.skills.ProcessedSkillManifest skill = 3;
      intrinsic_proto.data.v1.DataAsset data = 4;
      intrinsic_proto.scene_objects.ProcessedSceneObjectManifest scene_object =
          5;
      intrinsic_proto.hardware_devices.v1.ProcessedHardwareDeviceManifest
          hardware_device = 6;
      intrinsic_proto.processes.ProcessAsset process = 7;
    }

    reserved 199;
  }

  message Instance {
    // The asset to be used to back this instance.  The value is used as a
    // lookup in the assets map.
    string asset = 4;

    intrinsic_proto.assets.v1.InstanceConfig config = 6;
    reserved 1, 2, 3, 5;
    reserved "data_files", "id", "scheduled_node_hostname", "service_config";
  }

  // A map whose values are the assets used in this application. The keys are
  // the asset's ID.
  map<string, Asset> assets = 12;

  // A map whose keys are instance names and whose values are the instances
  // used in the application.
  map<string, Instance> instances = 13;

  // A sequence of updates that are applied to scene object instances to
  // construct a world.
  repeated intrinsic_proto.world.ObjectWorldUpdate object_world_updates = 14;

  // Runtime switch indicating in which mode the app will be started or is
  // running (e.g., in simulation or on real hardware).
  OperationMode operation_mode = 7;

  reserved 3, 9, 11;
  reserved "data_files", "product", "products";
}
