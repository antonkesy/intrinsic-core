syntax = "proto3";

package intrinsic_proto.config.internal;

option go_package = "intrinsic/config/proto/any_wrapper_go_proto";

// Replacement for Any proto for serialization as JSON.
//
// The proto <-> JSON converter used to store the data in Firebase attempt to
// unpack all Any protos which requires that their types must be included in
// all binaries. To avoid this restriction we replace all Any protos with this
// wrapper proto.
message AnyWrapper {
  string type_url = 1;
  bytes value = 2;
}
