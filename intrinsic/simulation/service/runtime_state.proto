syntax = "proto3";

package intrinsic_proto.simulation.internal;

option go_package = "intrinsic/simulation/service/runtime_state_go_proto";

// Runtime state of the simulation service. Backed to the K-V store and used for
// crash recovery.
message RuntimeState {
  string simulator_world_id = 1;
  string simulator_world_state_updates_pubsub_topic_name = 2;
}
