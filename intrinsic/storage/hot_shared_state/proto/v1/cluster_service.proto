syntax = "proto3";

package intrinsic_proto.hot_shared_state.v1;

import "intrinsic/config/proto/cluster.proto";

option go_package = "intrinsic/storage/hot_shared_state/proto/v1/cluster_service_go_proto";

service HotSharedStateClusterService {
  // Get the current cluster proto.
  rpc GetCurrentCluster(GetCurrentClusterRequest)
      returns (GetCurrentClusterResponse) {}

  // Set the current cluster proto.
  rpc SetCurrentCluster(SetCurrentClusterRequest)
      returns (SetCurrentClusterResponse) {}
}

enum ClusterView {
  // The default view is `CLUSTER_VIEW_FULL`.
  CLUSTER_VIEW_UNSPECIFIED = 0;

  // Returns the cluster proto without the application.
  CLUSTER_VIEW_NO_APPLICATION = 1;

  // Returns the full cluster proto including the full application.
  CLUSTER_VIEW_FULL = 2;
}

message GetCurrentClusterRequest {
  // View of the cluster to return. Defaults to the full cluster if not set.
  ClusterView view = 1;
}

message GetCurrentClusterResponse {
  intrinsic_proto.config.Cluster cluster = 1;

  // An equality-comparable revision token that is used for optimistic
  // concurrency control. If you want to modify/update the current cluster, you
  // need to perform a `GetCurrentCluster` call first and provide this token in
  // the subsequent `SetCurrentCluster` request. Treat this token as an opaque
  // string, i.e. do not rely on its length or structure, and do not modify it.
  string revision_token = 2;
}

message SetCurrentClusterRequest {
  // The cluster to set. The `metadata.name` field of the cluster will be
  // overwritten with the current cluster name.
  intrinsic_proto.config.Cluster cluster = 1;

  // An optional revision token. Provide it if you want to update a document.
  // There are five possible scenarios:
  //
  // 1. No token is provided: This call is treated as a
  //    "Create Current Cluster" call.
  //
  //    1a. The specified document does not exist. Then, barring any other
  //        errors, the call should succeed, create the
  //        cluster, and return
  //        the `OK` code.
  //    1b. The specified document exists. Then, the call fails (cannot create
  //        a document if it already exists) and returns the `ALREADY_EXISTS`
  //        code.
  //        Exception: If the `overwrite` flag is set to `true`, then the
  //        document is updated even though the token is empty.
  //
  // 2. A non-empty token from a previous `GetCurrentCluster`
  //    request is provided: This call is treated as an "Update Current
  //    Cluster" call.
  //
  //    2a. The specified document does not exist. Then, the call fails
  //        (the document has been deleted in the meantime) and returns the
  //        `NOT_FOUND` code.
  //        Exception: If the `overwrite` flag is set to `true`, then the
  //        document is created.
  //    2b. The document exists and its revision matches the provided token
  //        provided. Then, barring any other errors, the call should succeed,
  //        update the cluster, and
  //        return the `OK` code.
  //    2c. The document exists and its revision token differs from the
  //        provided token: Then, the call fails (the document has been updated
  //        in the meantime) and returns the `ABORTED` code. The client should
  //        retry with a new token by running the
  //        `GetCurrentCluster`-`SetCurrentCluster` sequence again.
  //        Exception: If the `overwrite` flag is set to `true`, then the update
  //        is performed even though the token does not match.
  // Also see go/canonical-codes for the return code semantics.
  string revision_token = 2;

  // If true, overwrite the contents of any existing document or force-create
  // it.
  bool overwrite = 3;
}

message SetCurrentClusterResponse {
  // The created or updated current cluster. This proto is obtained
  // non-atomically after the `Set` operation and might be different from
  // the one in the request message in case of high write load!
  intrinsic_proto.config.Cluster cluster = 1;

  string revision_token = 2;
}
