syntax = "proto3";

package intrinsic_proto.catalog;

import "intrinsic/executive/proto/behavior_tree.proto";
import "intrinsic/kubernetes/workcell_spec/proto/image.proto";

option go_package = "intrinsic/skills/catalog/proto/skill_deployment_data_go_proto";

// Information needed to install a skill.
message SkillDeploymentData {
  // The fully-qualified globally unique id of the skill version.
  // Format: {package}.{name}.{version}
  string id_version = 1;

  oneof deployment_type {
    // A skill's service implementation compiled into a container image.
    workcell_spec.v1.Image image = 2;

    // A parameterizable behavior tree.
    executive.BehaviorTree behavior_tree = 3 [deprecated = true];

    // A CAS URI for the executive behavior tree.
    // Note: we expect to handle versioning of the executive behavior tree API
    // by adding additional oneof fields with version indication, so that the
    // client knows which major version of the BehaviorTree proto schema is
    // stored at the CAS URI. At the moment, there is no versioning on the
    // executive APIs, so the field name has no version indication.
    string executive_behavior_tree_cas_uri = 4;
  }

  reserved 10;
  reserved "allow_skill_to_skill_communication";
}
