syntax = "proto3";

package intrinsic_proto.skills;

import "intrinsic/world/proto/object_world_updates.proto";

option go_package = "intrinsic/skills/apps/update_world_go_proto";

// The parameter messages used for the update_world skill. Contains the updates
// to apply to the world when executing the skill.
message UpdateWorldParams {
  // The World update(s) to be applied to the world when executing this skill.
  oneof update_input {
    // A single ObjectWorldUpdate to be applied.
    world.ObjectWorldUpdate update = 1;
    // The ObjectWorldUpdates to be applied to the world.
    world.ObjectWorldUpdates updates = 2;
  }
}
