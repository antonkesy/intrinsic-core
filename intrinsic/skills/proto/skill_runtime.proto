syntax = "proto3";

package intrinsic_proto.skills;

import "intrinsic/skills/proto/skill_registry_config.proto";

option go_package = "intrinsic/skills/proto/skill_runtime_go_proto";

// This proto holds additional information about a skill that is needed at
// runtime. It is currently only used for PBT-based skills but may expand in
// the future to hold other data.
message SkillRuntime {
  // The fully qualified skill id.
  string id_version = 1;

  // The registration information for the BehaviorTree
  intrinsic_proto.skills.BehaviorTreeRegistration registration = 2;
}
