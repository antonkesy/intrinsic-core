syntax = "proto3";

package intrinsic_proto.pagination.internal;

import "google/protobuf/timestamp.proto";

option go_package = "intrinsic/util/pagination/page_token_go_proto";

message PageToken {
  google.protobuf.Timestamp created = 1;

  reserved 2, 3, 4;
  // We deprecated those fields. Library users that want to ensure the paginated
  // requests are consistent should do this by storing the upstream service's
  // request in the "request" field and comparing it to the current one.
  reserved "order_by", "direction";

  // Use bytes here because using "google.protobuf.Any" bloats the serialized
  // proto with the protobuf type string.
  bytes request = 5;

  // See
  // //intrinsic/kubernetes/data_store/firestore_shim/firestore_shim_types.go
  // and
  // //intrinsic/util/pagination/page_token.go
  // for the explanation of those two fields.
  repeated string start_after = 6;
  string start_after_id = 7;
}
