syntax = "proto3";

package intrinsic_proto.resources;

import "google/protobuf/any.proto";
import "intrinsic/scene/proto/v1/scene_object.proto";
import "intrinsic/scene/proto/v1/scene_object_config.proto";
import "intrinsic/world/proto/world_fragment.proto";
import "intrinsic/world/proto/object_world_updates.proto";

option go_package = "intrinsic/resources/proto/geometric_resource_data_go_proto";

message GeometricResourceInstanceData {
  // The resource instance's name.
  string name = 1;

  // The world fragment associated with the entity.
  intrinsic_proto.world.WorldFragment world_fragment = 2;

  // The scene object associated with the entity.
  // Only one of `world_fragment` or `scene_object` should be set.
  // If both are set, then `scene_object` takes precedence.
  intrinsic_proto.scene_object.v1.SceneObject scene_object = 4;

  // Service configuration, if the asset has a service component.
  google.protobuf.Any configuration = 3;

  // SceneObject configuration, if the asset has a scene object component.
  intrinsic_proto.scene_object.v1.SceneObjectConfig scene_object_config = 5;
}

message GeometricResourceSetData {
  // This is a mapping from resource instance name to the world fragment that
  // defines the geometry for the resource. Includes both sideloaded and
  // versioned resources.
  repeated GeometricResourceInstanceData instance_data = 1;

  // The world updates that compose the different instances together.
  //
  // TODO: b/311443570 -- Migrate this to use scene updates.
  intrinsic_proto.world.ObjectWorldUpdates updates = 2;
}
