syntax = "proto3";

package intrinsic_proto.resources;

import "intrinsic/resources/proto/resource_registry.proto";

option go_package = "intrinsic/resources/proto/resource_registry_internal_go_proto";

service ResourceRegistryInternal {
  // Use the ResourceRegistry service instead.
  option deprecated = true;

  // Lists all resource instances in the currently deployed app. Returns empty
  // list if no app is currently running.
  rpc ListResourceInstances(ListResourceInstanceRequest)
      returns (ListResourceInstanceResponse) {}

  // Gets specific resource instance from the currently deployed app.
  rpc GetResourceInstance(GetResourceInstanceRequest)
      returns (ResourceInstance) {}
}
