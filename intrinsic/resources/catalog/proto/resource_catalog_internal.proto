syntax = "proto3";

package intrinsic_proto.catalog;

import "intrinsic/resources/proto/resource_type.proto";

option go_package = "intrinsic/resources/catalog/proto/resource_catalog_internal_go_proto";

service ResourceCatalogInternal {
  // Retrieves the internal ResourceType for the specified resource.
  rpc GetInternalResourceType(GetInternalResourceTypeRequest)
      returns (GetInternalResourceTypeResponse);

  // Lists the internal ResourceTypes for the specified resources.
  rpc ListInternalResourceTypes(ListInternalResourceTypesRequest)
      returns (ListInternalResourceTypesResponse);
}

message GetInternalResourceTypeRequest {
  // The fully-qualified globally unique id of the resource to install.
  string id_version = 1;
}

message GetInternalResourceTypeResponse {
  intrinsic_proto.config.ResourceType resource_type = 1;
}

message ListInternalResourceTypesRequest {
  // The fully-qualified globally unique ids of the resources to install.
  repeated string id_versions = 1;
}

message ListInternalResourceTypesResponse {
  repeated intrinsic_proto.config.ResourceType resource_types = 1;
}
