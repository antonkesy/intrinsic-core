syntax = "proto3";

package intrinsic_proto;

option go_package = "intrinsic/math/proto/iir_filter_config_go_proto";

// Generic digital IIR filter coefficients, where a filter of order N has N+1
// coefficients. `b` are the numerator coefficients in the transfer function,
// and `a` are denominator coefficients, see also
// https://en.wikipedia.org/wiki/Infinite_impulse_response. Filter coefficients
// b=(b0, b1, ..., bN) and a=(a0, a1, ..., aN) must be normalized, e.g. the
// first coefficient in `a` is a_0=1.0. These coefficients define the SISO
// difference equation
//
// y[k] + a1*y[k−1] + a2*y[k−2] + ... + aN*y[k−N] =
// b0*u[k] + b1*u[k−1] + b2*u[k−2] + ... + bN*u[k−N]
//
// and equivalently the discrete-time transfer function
//
//         b_0 + b_1*z^-1 + ... + b_N*z^-N
//  H(z) = ---------------------------------
//         1 + a_1*z^-1 + ... + a_N*z^-N
message DiscreteTimeIirFilterConfig {
  repeated double coefficients_a = 1;
  repeated double coefficients_b = 2;
}
