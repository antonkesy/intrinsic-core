syntax = "proto3";

package intrinsic_proto.rl;

import "intrinsic/math/proto/twist.proto";

option go_package = "intrinsic/ml/rl/proto/v1/spacemouse_go_proto";

message SpaceMouseState {
  // The timstamp when the command was sent.
  double timestamp = 1;
  // The directions commanded by the spacemouse in the range [-1, 1].
  intrinsic_proto.Twist twist = 2;
  // True if the button is pressed.
  bool button1 = 5;
  // True if the button is pressed.
  bool button2 = 6;

  reserved 3, 4;
}
