syntax = "proto3";

package intrinsic_proto.config;

option go_package = "intrinsic/config/proto/config_go_proto";

// FileReference maps an external file (e.g. on GCS) to its in-cluster path.
message FileReference {
  // Path of the file when loaded within the cluster, eg "/world/world.gzf".
  string path = 1;

  // URI describing the source of the file, e.g. on GCS
  // (gs://<bucket>/<file>#<generation>).
  string uri = 2;

  // Digest of the file. Optional.
  string digest = 3;
}

message FileReferences {
  repeated FileReference file_references = 1;
}
