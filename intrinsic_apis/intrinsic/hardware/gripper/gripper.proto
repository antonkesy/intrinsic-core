syntax = "proto3";

package intrinsic_proto.gripper;

import "intrinsic/perception/proto/v1/settings.proto"; 

option go_package = "intrinsic/hardware/gripper/gripper_go_proto";

message PinchGripperCommand {
  // Command id to disambiguate status messages.
  // If not set, the command may return earlier before the gripper has reached
  // the desired position.
  int64 command_id = 4;
  // Command options for desired position of grip joint.
  oneof position_command_options {
    // Desired position of grip joint in SI units.
    double position = 1;

    // Desired position of grip joint in percentage.
    double position_percentage = 11;
  }

  // Command options for velocity of grip joint.
  oneof velocity_command_options {
    // Velocity of grip joint in SI units.
    double velocity = 2;

    // Velocity of grip joint in percentage.
    double velocity_percentage = 12;
  }

  // Command options for desired or maximum applied effort to apply on grip
  // joint.
  oneof effort_command_options {
    // Desired or maximum applied effort to apply on grip joint in SI units.
    double effort = 3;

    // Desired or maximum applied effort to apply on grip joint in percentage.
    double effort_percentage = 13;
  }
}


// This message encapsulates format properties (e.g. in the SI unit or
// in the internal device-specific representation) for physical quantities
// (e.g. position, velocity, etc.) and its default value.
// For percentage properties, min values will be converted to 0 % and
// max values will be converted to 100 %.
// I do not use
// import "intrinsic/perception/proto/camera_settings.proto";
// because it will expect camera_settings_fastrtps_cc_proto which is not
// declared in package intrinsic/perception/proto .
message PhysicalQuantityFormatProperties {
  // The properties in the International System of Units (SI).
  intrinsic_proto.perception.v1.FloatSettingProperties si_properties = 1;

  // The properties in the internal device-specific representation, which is
  // encoded in a finite number of bits, for example 0-255 for 8 bits.
  intrinsic_proto.perception.v1.IntegerSettingProperties
      hardware_value_properties = 2;

  // The default value in SI unit.
  double default_si_value = 3;
}

message PinchGripperPhysicalConfig {
  PhysicalQuantityFormatProperties position = 1;
  PhysicalQuantityFormatProperties velocity = 2;
  PhysicalQuantityFormatProperties effort = 3;
}

message PinchGripperAdditionalConfig {
  // Gripper Cyclic Keep-Alive routine frequency (Hz).
  optional double cyclic_routine_frequency_hz = 2;

  // Gripper status topic for pubsub.
  optional string status_topic = 3;

  // Gripper command topic for pubsub. This topic expects PinchGripperCommand
  // messages which are then executed on a best-effort basis.
  optional string command_topic = 4;
}


message PinchGripperStatus {
  // Current position of the grip joint.
  double position = 1;

  // Grip joint is currently in motion.
  bool in_motion = 2;

  // Current position matches desired position.
  bool position_reached = 3;

  // Whether or not gripper is enabled.
  bool gripper_enabled = 4;

  // Requested position.
  double position_requested = 5;

  // (Optional) command id to disambiguate status messages.
  int64 command_id = 6;

  // Whether an object was detected by the gripper. The object detection may not
  // work correctly for very thin objects. In those cases, an object can be
  // considered detected if the gripper fingers reached the desired position. In
  // short, for thin objects the following object detection logic may be more
  // robust: `object_detected` OR `position_reached`.
  bool object_detected = 7;
}
