syntax = "proto3";

package intrinsic_proto.config;

option go_package = "intrinsic/resources/proto/resource_volume_go_proto";

// VolumeMount specifies how a Volume is mounted in the resource.
// Its name must match a specified volume.
// See: https://kubernetes.io/docs/concepts/storage/volumes/
message VolumeMount {
  string name = 1;
  string mount_path = 2;
  bool read_only = 3;
}

// Volume represents a named volume in the pod that may be accessed by the
// resource through a VolumeMount.
// See: https://kubernetes.io/docs/concepts/storage/volumes/
message Volume {
  string name = 1;
  oneof source {
    HostPathVolumeSource host_path = 2;
    EmptyDirVolumeSource empty_dir = 3;
  }
}

// HostPathVolumeSource describes a path on the host machine that should be made
// accessible to the resource.
// See: https://kubernetes.io/docs/concepts/storage/volumes/#hostpath
message HostPathVolumeSource {
  // The path on the host to make available.
  string path = 1;
  // The type of file to be mounted.  See hostPath docs for allowable values.
  string type = 2;
}

// EmptyDirVolumeSource describes a volume created for use by the resource.
// See: https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
message EmptyDirVolumeSource {
  // This can be "Memory" or blank.  If unspecified, the host system's default
  // is used.
  string medium = 1;
}

