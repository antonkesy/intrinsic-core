syntax = "proto3";

package intrinsic_proto.world;

import "google/protobuf/timestamp.proto";
import "intrinsic/math/proto/pose.proto";
import "intrinsic/math/proto/vector3.proto";

option go_package = "intrinsic/world/proto/kinematics_component_go_proto";

// Component indicating the owning Entity represents a DoF.

// Next tag: 15

message KinematicsComponent {

  //
  // It's worthwhile to spell out how setting a joint's value results in the
  // `inboard_t_outboard` (a.k.a. actuation) transform being computed and
  // applied to the joint's `AttachmentComponent.parent_t_this`.
  //
  // 1. raw_value is set by a user (e.g. through a SetDof() function).
  // 2. The raw_value value is combined with the type and axis fields to compute
  //    a inboard_t_outboard transform. (For example, a TYPE_REVOLUTE joint's
  //    actuation is rotation about axis by the raw_value in radians; a
  //    TYPE_PRISMATIC joint's actuation is translation along axis by the
  //    raw_value in meters).
  // 3. This joint's AttachmentComponent::parent_t_this is set to
  //    parent_t_inboard * inboard_t_outboard * outboard_t_child.

  // Pose of the inboard coordinate frame in the parent object's space.
  intrinsic_proto.Pose parent_t_inboard = 10;

  // TODO(b/361105294): Remove this field and store onboard_t_child as child
  // AttachmentComponent's parent_t_this.
  // Pose of the child link's coordinate frame in the outboard coordinate frame.
  intrinsic_proto.Pose outboard_t_child = 13;

  // Type of joint.
  enum MotionType {
    MOTION_TYPE_UNDEFINED = 0;

    // 1 DoF, rotates about the axis.
    MOTION_TYPE_REVOLUTE = 1;

    // 1 DoF, translates along the axis.
    MOTION_TYPE_PRISMATIC = 2;

    // 0 DoF, inboard and outboard transforms are always equal.
    MOTION_TYPE_FIXED = 3;
  }
  MotionType motion_type = 1;

  // Axis of this joint in its local space (relative to its inboard coordinate
  // frame). If not set, +z is used by default.
  intrinsic_proto.Vector3 axis = 11;

  // Input into the value function. 
  // GetDof() and SetDof()-style functions operate on this value.
  optional double raw_value = 3;
  // Next tag: 6
  message Limits {
    double velocity = 1;
    double acceleration = 2;
    double jerk = 3;
    double effort = 5;

    // A pair of lower and upper limits.
    message LimitPair {
      double lower = 1;
      double upper = 2;
    }

    // Optional limits on raw_value. If none of these options are set, no limits
    // are enforced on raw_value.
    oneof raw_value_limits_type {
      LimitPair fixed_limits = 4;

      // In the future, we could have other types of value limits.
    }
  }

  // System limits of this joint.
  Limits system_limits = 5;

  // Application limits of this joint.
  Limits application_limits = 12;


  // Label used by path planning to identify this DoF.
  string dof_label = 6;


  // The physical velocity dependent viscous damping coefficient of the joint.
  double damping = 8;

  // The physical static friction value of the joint.
  double friction = 9;


  // The last time this component was updated.
  google.protobuf.Timestamp wall_clock_timestamp = 14;

  reserved 2, 4, 7;
  reserved "axis_old", "parent_t_inboard_old";

}
