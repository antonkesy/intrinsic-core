syntax = "proto3";

package intrinsic_proto.icon.hal;

option go_package = "intrinsic/icon/hal/tools/hardware_module_introspection_go_proto";

// Service to obtain information about available hardware modules.
service HardwareModuleInfo {
  // List available hardware modules and their interfaces.
  rpc List(ListHardwareModuleRequest) returns (HardwareModules) {}
}

// List hardware module request.
message ListHardwareModuleRequest {}

// Hardware interface information.
message HardwareInterface {
  // Name of the hardware interface.
  string name = 1;
  // True indicates that the HWM requires the robot controller to use this
  // interface. For commands, ApplyCommand will fail without a valid value in
  // this interface.
  bool must_be_used = 2;
}
// Information about the hardware module.
message HardwareModule {
  // Name of the hardware module.
  string name = 1;
  // List of hardware interfaces registered by the hardware module.
  repeated HardwareInterface interfaces = 2;
}
// Collection of hardware modules.
message HardwareModules {
  // List of hardware modules.
  repeated HardwareModule modules = 1;
}
