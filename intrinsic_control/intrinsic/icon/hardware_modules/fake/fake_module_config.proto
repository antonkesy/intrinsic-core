syntax = "proto3";

package intrinsic_proto.icon;

import "intrinsic/icon/proto/cart_space.proto";
import "intrinsic/icon/proto/io_block.proto";
import "intrinsic/icon/proto/part_status.proto";
import "intrinsic/icon/proto/safety_status.proto";

option go_package = "intrinsic/icon/hardware_modules/fake/fake_module_config_go_proto";

// Configures the exposed interfaces, their names and their initial state.
// Next ID: 7
message FakeModuleConfig {
  // The interfaces typically offered by a robot arm.
  // Registers any interface whose name is defined.
  // Next ID: 19
  message ArmInterfaces {
    optional string joint_position_command_name = 2;
    optional string joint_commanded_position_name = 18;
    optional string joint_velocity_command_name = 3;
    optional string process_wrench_command_name = 12;
    optional string joint_torque_command_name = 4;
    optional string hand_guiding_command_name = 13;
    optional string joint_position_state_name = 5;
    optional string joint_velocity_state_name = 6;
    optional string joint_acceleration_state_name = 7;
    optional string joint_torque_state_name = 8;
    optional string control_mode_state_name = 14;
    optional string payload_command_name = 15;
    optional string payload_state_name = 16;
    optional string joint_system_limits_name = 17;

    // Required to inform DOF of the defined interfaces. Used to set the initial
    // state.
    // The initial state is not required to be within limits. This is required
    // for some tests.
    repeated intrinsic_proto.icon.PartJointState initial_joint_state = 9;

    reserved 1, 10, 11;
  }
  // Next ID: 3
  message ADIOInterface {
    // Defines the ADIOs and sets the initial value. The keys (integers)
    // of the signals will be used as indices for the signal! Missing entries
    // inbetween will also be created and are initialized with the proto
    // default value.
    intrinsic_proto.icon.ADIOState initial_adio_state = 1;

    // If true, creates for each interface an additional loopback
    // command/status to change inputs or observe outputs.
    bool setup_loopback_interfaces = 2;
  }
  // Next ID: 3
  message SafetyInterface {
    string safety_status_name = 1;
    intrinsic_proto.icon.SafetyStatus initial_safety_status = 2;
  }
  // Next ID: 4
  message ForceTorqueInterface {
    string force_torque_status_name = 1;
    string force_torque_command_name = 2;
    optional Wrench initial_force_torque_state = 3;
  }
  // Next ID:3
  message RangefinderInterface {
    string rangefinder_status_name = 1;
    optional double initial_rangefinder_distance = 2;
  }

  optional ArmInterfaces arm_interfaces = 2;
  optional ADIOInterface adio_interface = 4;
  optional ForceTorqueInterface force_torque_interface = 5;
  optional SafetyInterface safety_interface = 3;
  optional RangefinderInterface rangefinder_interface = 6;

  reserved 1;
  reserved "cycle_time";
}
