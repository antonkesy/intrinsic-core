syntax = "proto3";

package intrinsic_proto.icon;

option go_package = "intrinsic/icon/hardware_modules/kuka_rsi/kuka_rsi_inspection_go_proto";

message KukaRsiInspectionData {
  // The automatic operation mode of the KUKA RSI robot since KUKA
  // differentiates between automatic (local) and external operation mode.
  enum AutomaticOperationMode {
    NONE = 0;
    AUTOMATIC = 1;
    EXTERNAL = 2;
  }
  // The automatic operation mode of the KUKA RSI robot.
  AutomaticOperationMode automatic_operation_mode = 1;
  // Signals whether RSI communication is currently active.
  bool rsi_active = 2;
}
