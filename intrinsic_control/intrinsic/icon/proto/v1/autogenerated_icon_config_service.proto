syntax = "proto3";

package intrinsic_proto.icon.v1;

import "intrinsic/icon/server/config/icon_main_config.proto";
import "google/api/annotations.proto";

option go_package = "intrinsic/icon/proto/v1/autogenerated_icon_config_service_go_proto";

// Request to get an autogenerated ICON main config based on the world specified
// by the `world_id`.
message AutoGeneratedIconConfigRequest {
  string world_id = 1;
}

// AutoGeneratedIconConfigService response that carries the IconMainConfig.
message AutoGeneratedIconConfigResponse {
  intrinsic_proto.icon.IconMainConfig autogenerated_icon_main_config = 1;
}

service AutoGeneratedIconConfigService {
  // Returns an autogenerated ICON main config based on the current hardware
  // assets deployed.
  rpc GetAutoGeneratedIconConfig(AutoGeneratedIconConfigRequest)
      returns (AutoGeneratedIconConfigResponse) {
    option (google.api.http) = {
      // Supply world_id as a URL parameter.
      get: "/v1/mainConfig:autoGenerate"
      response_body: "autogenerated_icon_main_config"
    };
  }
}
