syntax = "proto3";

package intrinsic_proto.skills;

option go_package = "intrinsic/icon/skills/enable_realtime_control_go_proto";

message EnableRealtimeControlParams {
  // Set to 'true' to attempt a fault reset before enabling movement.
  //
  // Avoid using this as much as possible. Clearing faults should be a
  // deliberate user interaction, not something your solution does
  // automatically.
  optional bool clear_faults = 1;
}
