syntax = "proto3";

package intrinsic_proto.icon.actions.proto;

option go_package = "intrinsic/icon/actions/cartesian_impedance_reference_generators_go_proto";

message CartesianPositionReflexxesImpedanceReferenceGenerator {
  // Parameters to be added via b/190081664.
}

message CartesianVelocityReflexxesImpedanceReferenceGenerator {
  // Parameters to be added via b/190081664.
}

message SimpleImpedanceReferenceGenerator {
  // Low-pass filter constant for a simple cartesian impedance reference
  // generator, defaults to 0.005, must be within ]0.0, 1.0], where 1.0
  // corresponds to no filtering, and a small value like 1e-4 corresponds to
  // very strong filtering. The reference generator will return an error if the
  // filter constant is set to 0.0.
  optional double lowpass_filter_constant = 1;
}

// Movement duration for a quintic spline Cartesian reference generator, must be
// greater than or equal to 0.0.
message QuinticSplineCartesianReferenceGenerator {
  double movement_duration_seconds = 1;
}

message ReflexxesNullspaceReferenceGenerator {
  // Parameters to be added via b/190081664.
}

message SimpleNullspaceReferenceGenerator {
  // Low-pass filter constant for a simple nullspace impedance reference
  // generator, defaults to 0.005,  must be within ]0.0, 1.0], where 0.0
  // corresponds to no filtering.
  optional double lowpass_filter_constant = 1;
}

// Movement duration for a quintic spline nullspace reference generator, must
// be greater than or equal to 0.0.
message QuinticSplineNullspaceReferenceGenerator {
  double movement_duration_seconds = 1;
}

// Bundled message for Cartesian impedance and nullspace reference generators.
message ReferenceGenerators {
  message Cartesian {
    oneof reference_generator {
      CartesianPositionReflexxesImpedanceReferenceGenerator position_reflexxes =
          1;

      CartesianVelocityReflexxesImpedanceReferenceGenerator velocity_reflexxes =
          2;

      SimpleImpedanceReferenceGenerator simple_lowpass = 3;

      QuinticSplineCartesianReferenceGenerator quintic_spline = 4;
    }
  }

  message Nullspace {
    oneof reference_generator {
      ReflexxesNullspaceReferenceGenerator reflexxes = 1;

      SimpleNullspaceReferenceGenerator simple_lowpass = 2;

      QuinticSplineNullspaceReferenceGenerator quintic_spline = 3;
    }
  }

  Cartesian cartesian = 1;
  Nullspace nullspace = 2;
}
