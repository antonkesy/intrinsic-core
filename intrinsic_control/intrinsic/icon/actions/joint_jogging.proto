syntax = "proto3";

package intrinsic_proto.icon.actions.proto;

import "intrinsic/icon/proto/joint_space.proto";
import "intrinsic/kinematics/types/joint_limits.proto";

option go_package = "intrinsic/icon/actions/joint_jogging_go_proto";

// Fixed parameters for a joint jogging action. These are provided once by
// the user when the action is created, and remain the same for the lifetime of
// the action.
message JointJoggingFixedParams {
  // The joint limits to apply the streaming motion commands.
  // The limits need to be appropriate for jogging the specific robot, as well
  // as more conservative than the maximum limits configured on the ICON server.
  // The limits are also used to blend between motion commands.
  optional intrinsic_proto.JointLimits joint_limits = 1;
}

// Streaming parameters for a joint jogging action. These are provided with
// every streaming command.
message JointJoggingStreamingParams {
  // The desired joint velocity in rad/s. Need to conform to the configured
  // `joint_limits`.
  intrinsic_proto.icon.JointVec goal_velocity = 1;
}
