syntax = "proto3";

package intrinsic_proto.icon;

option go_package = "intrinsic/hardware/force_torque/axia80_net/axia80_net_go_proto";

message Axia80NetConfig {
  // Ip address of the device. If you are having trouble figuring out the
  // configured ip, use the "ATI Discovery Tool" on this page:
  // https://www.ati-ia.com/Products/ft/software/net_ft_software.aspx
  string ip = 1;

  // Scaling factors from the raw reading to force and torque respectively.
  uint64 counts_per_force = 2;
  uint64 counts_per_torque = 3;

  // During ReadStatus, the hwm checks the time of the latest reading, and
  // returns an error if the reading is older than this time. Must be set > 0.
  // If left unset, this will be automatically set to 2x the configured control
  // period.
  //
  // Typically you'd want to set this at (or slightly above) your control
  // period to ensure that the reading is recent enough to be relevant.
  // Depending on the streaming rate configured on the device, you may need to
  // add a bit of margin to prevent spurious timeouts.
  optional double timeout_on_stale_read_seconds = 4;

  // Blocking time for the recv call in the thread communicating with the
  // device. Must be set > 0. If left unset, this will be automatically set
  // to 2x the configured control period.
  //
  // Typically, you'd set this to be the time after which you'd consider the
  // connection with the device to have failed. If the timeout passes without
  // receiving a message, the whole connection is retried at longer intervals.
  optional uint64 timeout_on_socket_recv_us = 5;
}
