syntax = "proto3";

package intrinsic_proto.gpio;

option go_package = "intrinsic/hardware/gpio/icon_gpio_service_config_go_proto";

// Configuration for ICON GPIO service.
message IconGpioServiceConfig {
  // The name of the ICON instance to connect to.
  string robot = 1;

  // List of ADIO parts to connect to that are part of the `robot` ICON
  // instance.
  repeated string parts = 6;

  // The name of the equipment instance this server represents.
  string equipment_instance_name = 3;

  // The address of the ICON server including the port (possibly behind
  // ingress).
  string icon_address = 4;

  // The header to be used with the equipment instance name in the metadata of
  // requests.
  string equipment_instance_header = 5;

  reserved 2;
}
