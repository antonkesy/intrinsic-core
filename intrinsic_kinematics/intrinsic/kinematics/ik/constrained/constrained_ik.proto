syntax = "proto3";

package intrinsic_proto.kinematics;

import "intrinsic/icon/proto/joint_space.proto";
import "intrinsic/math/proto/matrix.proto"; 
import "intrinsic/math/proto/point.proto";  
import "intrinsic/math/proto/pose.proto";   

option go_package = "intrinsic/kinematics/ik/constrained/constrained_ik_go_proto";

// A constraint that imposes that valid configurations of the Chain obey the
// specified lower and upper joint position limits.
message JointPositionLimitsConstraint {
  intrinsic_proto.icon.JointVec lower_limits = 1;
  intrinsic_proto.icon.JointVec upper_limits = 2;
  // The optional joint position limit error rate gain. If not specified, will
  // default to 0.99.
  optional double joint_position_limit_error_rate_multiplier = 3;
}


// TODO(giftthaler, efernan): using the element-id to specify the target "frame"
// in the kinematic tree is a temporary solution. Need to discuss and integrate
// a better long-term solution.
message RobotFrame {
  uint32 element_id = 1;
}

// Equality constraint enforcing that the 3D Cartesian position of a `target`
// must match desired target location.
message PointConstraint {
  // The position that the target point must reach w.r.t. the robot base
  // frame.
  intrinsic_proto.Point base_p_target_desired = 1;
  // Fixed frame on a robot link in which `robot_frame_p_target` is expressed,
  // for instance the flange frame.
  RobotFrame robot_frame = 2;
  // Optional offset between the `robot_frame` and target frame.
  // Defaults to zero.
  optional intrinsic_proto.Point robot_frame_p_target = 3;
  // Maximum allowed position error, in meters, i.e. max l1-norm error.
  optional double max_position_error = 4;
}

// A `PoseConstraint` with a target pose `base_t_target_desired` for a
// given `robot_frame` with optional offset `robot_frame_t_target` between the
// specified robot frame and the target location. `robot_frame_t_target` can be
// employed to solve inverse kinematics with arbitrary poses, which do not have
// an own ElementId.
message PoseConstraint {
  // The pose that the end effector target must reach w.r.t. the robot base
  // frame.
  intrinsic_proto.Pose base_t_target_desired = 1;
  // Fixed frame on a robot link in which 'robot_frame_t_target' is expressed,
  // for instance the flange frame.
  RobotFrame robot_frame = 2;
  // Optional offset between the `robot_frame` and the target frame.
  // Defaults to the Identity pose.
  optional intrinsic_proto.Pose robot_frame_t_target = 3;
  // Maximum allowed position error, in meters. i.e. max l1-norm error, defaults
  // to 1e-4.
  optional double max_position_error = 4;
  // The maximum angle (in radians) between the orientation of the tip and
  // the orientation of the target pose. i.e. The constraint is satisfied if the
  // tip orientation can get aligned with the target orientation by doing a
  // rotation around some unspecified axis of an angle smaller or equal than
  // max_angle_deviation.
  optional double max_angle_deviation = 5;
}

// The constraint that a point P expressed in frame 'target_frame' is contained
// inside an ellipsoid expressed in frame 'root_frame'. As an example, this
// constraint can be used to force that the tip of the chain reaches some target
// position expressed in the base frame, but it's much more general than that.
// It allows frames other than the tip to be constrained and can even enforce
// that pairs of frames maintain a relative position difference.
message PositionEllipsoidConstraint {
  // The ElementId corresponding to frame 'target_frame'.
  RobotFrame target_frame = 1;
  // The ElementId corresponding to the 'root_frame'.
  RobotFrame root_frame = 2;
  // The pose, expressed in the 'root_frame', of the center of the ellipsoid
  // that point P needs to be contained in. The axes of the ellipsoid are
  // expressed in this frame.
  intrinsic_proto.Pose root_t_target_ellipsoid = 3;
  // The ellipsoid half-axes in the frame of the ellipse.
  double rx = 4;
  double ry = 5;
  double rz = 6;
  // The point P, expressed in the 'target_frame', that we want to constrain.
  // Defaults to zero.
  optional intrinsic_proto.Point p_in_target_frame = 7;
  // Max position deviation in [m].
  optional double tolerance = 8;
}

// Defines a Plane inequality constraint which forces a given frame to stay on
// the side of the plane. The PlaneConstraint uses the coordinates of a point on
// the plane 'base_p_point_on_plane' and the plane's normal expressed in the
// base frame 'plane_normal_in_base_frame'. The constraint will enforce that the
// target frame (plus optional 'target_frame_p_offset') lies on the side of the
// plane into which the normal vector points.
message PlaneConstraint {
  intrinsic_proto.Point base_p_point_on_plane = 1;
  intrinsic_proto.Point plane_normal_in_base_frame = 2;
  // The ElementId corresponding to frame 'target_frame'.
  RobotFrame target_frame = 3;
  // Offset of target 'point' w.r.t the frame specified by 'target_frame'.
  optional intrinsic_proto.Point target_frame_p_offset = 4;
  // Max position deviation in [m].
  optional double tolerance = 5;
}

// Equality constraint which realizes a desired orientation of the target frame,
// but allows free rotation about a user-defined axis.
message OrientationWithFreeAxisConstraint {
  // The unit vector that describes the free axis in the base frame.
  intrinsic_proto.Point target_axis_in_base_frame = 1;
  // The unit vector that describes the axis to align in the target frame.
  intrinsic_proto.Point axis_to_align_in_target_frame = 2;
  // Fixed frame on a robot link in which 'robot_frame_t_target' is expressed,
  // for instance the flange frame.
  RobotFrame robot_frame = 3;
  // The (optional) maximum allowed angle between the two axes.
  optional double tolerance_rad = 4;
  // Optional offset between the `robot_frame` and the target frame.
  // Defaults to the Identity pose.
  optional intrinsic_proto.Pose robot_frame_t_target = 5;
}

// Inequality constraint which aligns a user-definable axis of the target frame
// with the given cone defined by a cone axis and a cone opening angle.
message OrientationConeConstraint {
  // The unit vector that describes the cone axis in the base frame.
  intrinsic_proto.Point cone_axis_in_base_frame = 1;
  // The unit vector that describes the axis to align in the target frame.
  intrinsic_proto.Point axis_to_align_in_target_frame = 2;
  // Fixed frame on a robot link in which 'robot_frame_t_target' is expressed,
  // for instance the flange frame.
  RobotFrame robot_frame = 3;
  // Opening half-angle of the cone in radians.
  double cone_opening_half_angle_rad = 4;
  // The (optional) maximum allowed violation of the maximum cone angle.
  optional double tolerance_rad = 5;
  // Optional offset between the `robot_frame` and the target frame.
  // Defaults to the Identity pose.
  optional intrinsic_proto.Pose robot_frame_t_target = 6;
}

// Currently only supports parameterization in Quadratic Programming (QP)
// Inverse Kinematics (IK): Implements the constraint
// "joint_velocities_lowerbound <= next_joint_velocities <=
// joint_velocities_upperbound". The constrained optimization variable is
// `next_joint_velocities`.
message JointVelocityLimitsConstraint {}

// Currently only supports parameterization in Quadratic Programming (QP)
// Inverse Kinematics (IK): Implements the constraint "next_joint_accelerations
// = (next_joint_velocities
// - current_joint_velocities) / dt_seconds <= maximum_absolute_acceleration" or
// "(joint_accelerations_lowerbound * dt_seconds) + current_joint_velocities <=
// next_joint_velocities <= (joint_accelerations_upperbound * dt_seconds) +
// current_joint_velocities". The constrained optimization variable is
// `next_joint_velocities`. The purpose of this constraint is to ensure that the
// acceleration limits are observed.
message JointAccelerationLimitsConstraint {}

// A wrapper / container for all possible constraints for Constrained Inverse
// Kinematics (IK).
message Constraint {
  string name = 1;
  oneof constraint {
    JointPositionLimitsConstraint joint_position_limits_constraint = 2;
    JointVelocityLimitsConstraint joint_velocity_limits_constraint = 9;
    JointAccelerationLimitsConstraint joint_acceleration_limits_constraint = 10;
    PointConstraint point_constraint = 3;
    PoseConstraint pose_constraint = 4;
    PlaneConstraint plane_constraint = 5;
    PositionEllipsoidConstraint position_ellipsoid_constraint = 6;
    OrientationWithFreeAxisConstraint orientation_free_axis_constraint = 7;
    OrientationConeConstraint orientation_cone_constraint = 8;
  }
}

// Defines a quadratic cost on the difference of the joint values with the
// target joint values. The actual cost is given by: 0.5 * dq' * Q * dq,
// where dq = q - q_target. The matrix Q needs to be positive semidefinite.
message JointPositionCost {
  // The target joint position vector that yields cost 0.
  intrinsic_proto.icon.JointVec target_joint_position = 1;
  // The cost matrix. Needs to be positive semidefinite.
  intrinsic_proto.Matrixd q_matrix = 2;
}

// Parameterizes a cost function term "0.5 * weight * (joint_velocities -
// desired_joint_velocities)^T * (joint_velocities - desired_joint_velocities)".
message JointVelocityCost {
  // The scalar weight of this cost. Must be positive.
  double weight = 1;
  // The desired joint velocity vector that yields cost 0.
  intrinsic_proto.icon.JointVec desired_joint_velocities = 2;
}

// Defines a cost whose minimization will maximize the manipulability metric, or
// in other words: a cost that penalizes joint positions that may restrict
// future local movements around that pose.
message ManipulabilityCost {
  // The scalar weight of this cost. Must be positive.
  double weight = 1;
  // Fixed frame on a robot link in which the manipulability is computed,
  // for instance the flange frame.
  RobotFrame robot_frame = 2;
}

// Defines a cost whose minimization will maximize both the manipulability
// metric and the closest distance to joint limit, simultaneously.
message ManipulabilityTimesMinimumJointLimitDistanceCost {
  // The scalar weight of this cost. Must be positive.
  double weight = 1;
  // The RobotFrame in which 'robot_frame_t_target' is expressed,
  // for instance the flange frame.
  RobotFrame robot_frame = 2;
  // Optional offset between the RobotFrame and target frame.
  // Defaults to the Identity pose.
  optional intrinsic_proto.Pose robot_frame_t_target = 3;
  // The optional softmin() function's alpha variable. If not specified, will
  // default to -10.0.
  optional double softmin_alpha = 4;
}

// A wrapper / container for all possible costs for Constrained Inverse
// Kinematics (IK).
message Cost {
  string name = 1;
  oneof cost {
    JointPositionCost joint_position_cost = 2;
    JointVelocityCost joint_velocity_cost = 5;
    ManipulabilityCost manipulability_cost = 3;
    ManipulabilityTimesMinimumJointLimitDistanceCost
        manipulability_times_min_joint_limit_distance_cost = 4;
  }
}

// The constrained optimization problem specification that some
// kinematics::Chain must achieve in terms of constraints that need to be
// satisfied and costs that need to be minimized.
message ConstrainedGoal {
  // The constraints that a valid solution must satisfy.
  repeated Constraint constraints = 1;

  // The costs that an optimal solution must minimize (locally). The total cost
  // is the weighted sum of the individual costs.
  repeated Cost costs = 2;
}


