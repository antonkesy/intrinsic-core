syntax = "proto3";

package intrinsic_proto.proto_registry.internal;

option go_package = "github.com/intrinsic-ai/insrc/intrinsic_runtime/intrinsic/proto_tools/proto";

// Internal message representing a file descriptor set name. Can be used, e.g.,
// for obfuscation.
message FileDescriptorSetName {
  string type_url_prefix = 7;
}
